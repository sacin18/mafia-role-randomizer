name: Build Native Android APK & iOS App

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Shareable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Web Assets into Native Bundles
        run: python3 sync-assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release & Debug APK
        working-directory: ./android
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Upload Shareable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MafiaHub-Android-APK
          path: |
            android/app/build/outputs/apk/**/*.apk

  build-ios:
    name: Build Native iOS App (Simulator / Unsigned IPA)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Web Assets into Native Bundles
        run: python3 sync-assets.py

      - name: Build iOS App with Xcode
        working-directory: ./ios
        run: |
          xcodebuild \
            -project MafiaHub.xcodeproj \
            -scheme MafiaHub \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
